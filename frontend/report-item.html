<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102a43"><title>Report an item — FindIt</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/components.css"><script type="module" src="./js/report-item.js"></script></head>
<body><header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">F</span><span>Find<span class="brand-accent">It</span></span></a><button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="main-nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./dashboard.html">Browse items</a><a class="button button-small" href="./dashboard.html">Dashboard</a><button class="nav-logout hidden" type="button">Sign out</button></nav></header><main class="shell form-page"><a class="back-link" href="./dashboard.html">← Back to reports</a><section class="form-panel"><div class="form-panel-heading"><span class="eyebrow">HELP SOMETHING GET HOME</span><h1>Report an item</h1><p>Share a few details to help the right person recognize it.</p></div><form id="report-form" novalidate><fieldset class="type-selector"><legend>What would you like to report?</legend><label class="type-option"><input type="radio" name="type" value="lost" checked><span class="type-option-icon">⌕</span><span><b>I lost something</b><small>Help others find your item</small></span></label><label class="type-option"><input type="radio" name="type" value="found"><span class="type-option-icon found-option">✓</span><span><b>I found something</b><small>Help it find its owner</small></span></label></fieldset><div class="form-row"><div><label for="title">Item title</label><input id="title" name="title" maxlength="120" placeholder="e.g. Blue water bottle" required></div><div><label for="category">Category</label><input id="category" name="category" maxlength="60" list="categories" placeholder="e.g. Electronics" required><datalist id="categories"><option>electronics</option><option>accessories</option><option>books</option><option>clothing</option><option>keys</option><option>stationery</option><option>other</option></datalist></div></div><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="2000" placeholder="Add details that could help someone recognize it…" required></textarea><div class="form-row"><div><label for="location">Campus location</label><input id="location" name="location" maxlength="160" placeholder="e.g. Library, first floor" required></div><div><label for="date">Date lost or found</label><input id="date" name="date" type="date" required></div></div><label for="image">Item photo <span class="label-secondary">(JPEG, PNG or WebP · up to 5 MB)</span></label><label class="upload-box" for="image"><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required><span class="upload-prompt"><span class="upload-icon">↑</span><b>Choose a photo to upload</b><small>Clear photos help the campus community recognize the item.</small></span><img id="image-preview" class="image-preview hidden" alt="Preview of selected item photo"></label><p class="form-message" id="form-message" role="alert" aria-live="polite"></p><div class="form-actions"><a class="button button-outline" href="./dashboard.html">Cancel</a><button class="button" type="submit" id="submit-button">Post report <span aria-hidden="true">→</span></button></div></form></section></main><footer class="site-footer"><a class="brand" href="./index.html"><span class="brand-mark">F</span><span>Find<span class="brand-accent">It</span></span></a><p>A campus community, looking out for one another.</p><span>© <span data-year></span> FindIt</span></footer></body></html>
